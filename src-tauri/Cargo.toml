[package]
name = "solr-curves"
version = "1.1.0"
description = "Sol-R Curves - live curve editor for the Sol-R flightstick in T.A.R.G.E.T."
edition = "2021"
rust-version = "1.82"

[lib]
name = "solr_curves_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

# sound (the same engine as the WARDOGS soundboard app)
cpal = "0.18"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
rubato = "5"
rtrb = "0.4.0"
parking_lot = "0.12"
anyhow = "1"
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
tauri-plugin-single-instance = "2"
midly = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
